name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix filenames
        run: |
          if [ ! -f main.py ] && [ -f ana.py ]; then
            cp ana.py main.py
          fi

          if [ ! -f buildozer.spec ] && [ -f Buildozer.spec ]; then
            cp Buildozer.spec buildozer.spec
          fi

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip automake libltdl-dev
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Configure Buildozer
        run: |
          sed -i 's/^android.api *= *.*/android.api = 36/' buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec
          echo "p4a.branch = develop" >> buildozer.spec

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ball-Escape-APK
          path: bin/*.apk
          if-no-files-found: error
