name: Ball Escape Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare project
        run: |
          if [ ! -f main.py ] && [ -f ana.py ]; then
            cp ana.py main.py
          fi

          cat > buildozer.spec <<'EOF'
          [app]

          title = Ball Escape
          package.name = ballescape
          package.domain = org.bfgames

          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json

          version = 1.0

          requirements = python3,kivy

          orientation = landscape
          fullscreen = 1

          android.api = 36
          android.minapi = 23
          android.ndk = 28c

          android.accept_sdk_license = True

          android.archs = arm64-v8a

          p4a.branch = develop

          [buildozer]

          log_level = 2
          warn_on_root = 1
          EOF

          cat buildozer.spec
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Buildozer
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            automake \
            autoconf \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            cmake \
            libffi-dev \
            libssl-dev

          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Bootstrap Android SDK
        run: |
          buildozer android p4a -- --help || true

      - name: Accept Buildozer Android licenses
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"

          echo "Buildozer SDK:"
          find "$SDK" -name sdkmanager -type f 2>/dev/null || true

          SDKMANAGER=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi"
            exit 1
          fi

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

      - name: Verify AIDL
        run: |
          find "$HOME/.buildozer/android/platform/android-sdk" \
            -name aidl \
            -type f \
            -print

          AIDL=$(find "$HOME/.buildozer/android/platform/android-sdk" \
            -name aidl \
            -type f \
            | head -n 1)

          if [ -z "$AIDL" ]; then
            echo "AIDL HALA BULUNAMADI"
            exit 1
          fi

          echo "AIDL bulundu: $AIDL"

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ball-Escape-APK
          path: bin/*.apk
          if-no-files-found: error
